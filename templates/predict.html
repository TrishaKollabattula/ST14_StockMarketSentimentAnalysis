<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Sentiment Analysis</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
        }
        h1 {
            color: #ffab00;
        }
        .input-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button#predict {
            background-color: #ffab00;
            color: #121212;
        }
        button#no-sentiment {
            background-color: #555;
            color: #e0e0e0;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Stock Market Sentiment Analysis</h1>
        <!-- Form to collect message -->
        <form action="/predict" method="POST" id="sentimentForm">
            <div class="input-container">
                <input type="text" name="message" id="message" placeholder="Enter stock market news..." required>
            </div>
            <!-- Predict Button to submit the message -->
            <button type="submit" id="predict">Predict</button>
            <!-- No Sentiment Button (doesn't submit form) -->
            <button type="button" id="no-sentiment">No Sentiment</button>
        </form>
    </div>

</body>
</html>
