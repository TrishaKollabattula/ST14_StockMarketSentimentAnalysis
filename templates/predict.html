<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTune - Sentiment Analysis</title>
    <style>
        /* Reset and basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif; /* Set Lato font for everything */
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://media.giphy.com/media/Mc1yxvp8fIGuYXHJI0/giphy.gif?cid=790b7611zmw99oeq8closghanm3bzh7mnmvrzqbn2trw2ekw&ep=v1_gifs_search&rid=giphy.gif&ct=g'); /* Background GIF */
            background-size: 100% 100%; /* Make the GIF stretch to fit the entire screen */
            background-position: center; /* Center the GIF */
            background-repeat: no-repeat; /* Don't repeat the GIF */
            background-attachment: fixed; /* Keep the background fixed while scrolling */
        }

        .container {
            text-align: center;
            z-index: 1; /* Ensure the content is above the background */
            width: 100%;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .brand {
            font-family: 'Lato', sans-serif;
            font-size: 28px;
            color: #FFFFFF; /* White color */
            font-weight: 700;
        }

        .center-content {
            position: absolute;
            top: 30%; /* Positioned higher in the center */
            left: 50%;
            transform: translateX(-50%); /* Center horizontally */
        }

        .title {
            font-size: 48px;
            color: #FFFFFF; /* White color */
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quote {
            font-size: 18px;
            color: #FFFFFF; /* White color */
            margin-bottom: 20px;
        }

        .sentiment-form {
            margin-top: 20px; /* Space between quote and form */
        }

        .input-box {
            width: 400px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #FFFFFF; /* White border */
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2); /* Slight transparent input background */
            color: #FFFFFF;
            text-align: center;
            outline: none;
        }

        .input-box::placeholder {
            color: rgba(255, 255, 255, 0.7); /* Light placeholder color */
        }

        .know-btn {
            padding: 15px 40px;
            background-color: #3E2DFF; /* Blue button */
            color: #FFFFFF;
            font-family: 'Lato', sans-serif;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px; /* Lower the button */
            position: relative;
            top: 20px; /* Move button slightly down */
        }

        .know-btn:hover {
            background-color: #FF0000; /* Red on hover */
        }

        /* Footer styling */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #FFFFFF; /* White text */
            font-size: 16px;
        }

        .footer span {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="brand">TradeTune</span>
        </div>
        <div class="center-content">
            <h1 class="title">Sync with market sentiment</h1>
            <p class="quote">Understanding the market sentiment is key to making informed decisions</p>
            
            <!-- Sentiment Analysis Form -->
            <form class="sentiment-form" action="/predict" method="POST">
                <input type="text" name="message" class="input-box" placeholder="Enter your message" required>
                <br>
                <button type="submit" class="know-btn">Know Sentiment</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span>© 2025 TradeTune. All Rights Reserved.</span>
    </div>
</body>
</html>
