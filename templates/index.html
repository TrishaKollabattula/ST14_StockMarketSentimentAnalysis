<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Sentiment Analysis</title>
  <style>
    /* General Styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Video Background */
    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Header Styles */
    header {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
    }

    header nav {
      display: flex;
      gap: 20px;
    }

    header nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    header nav a:hover {
      color: #FFD700;
    }

    /* Main Content Styling */
    .content {
      z-index: 1;
      position: relative;
      color: #fff;
      max-width: 700px;
      padding: 30px;
    }

    .content h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .content p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }

    /* Centered Button Styling */
    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .predict-btn {
      padding: 15px 40px;
      font-size: 1.3rem;
      color: #fff;
      background-color: #75bf53;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .predict-btn:hover {
      background-color: #60adce;
      transform: scale(1.1);
    }

    /* Footer Styles */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9rem;
      z-index: 10;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: #FFD700;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      color: #fff;
    }

    /* Form Styles */
    .input-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .input-container input {
      padding: 10px;
      font-size: 1rem;
      width: 80%;
      border: 2px solid #75bf53;
      border-radius: 5px;
      color: #333;
    }

    .input-container button {
      padding: 10px 20px;
      font-size: 1.1rem;
      margin-left: 10px;
      color: #fff;
      background-color: #75bf53;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .input-container button:hover {
      background-color: #60adce;
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="background-video">
    <source src="https://videos.pexels.com/video-files/29344546/12647214_1920_1080_30fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Header -->
  <header>
    <h1>📈 StockPulse AI </h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="content">
    <h1>Stock Market Sentiment Analysis</h1>
    <p>Insights That Empower Your Investments!</p>
    <p>Stay ahead of the market trends and make informed decisions with our innovative tools.</p>

    <!-- Sentiment Prediction Form -->
    <form action="/predict" method="POST">
      <div class="input-container">
        <input type="text" name="message" placeholder="Enter stock news or analysis..." required>
        <button type="submit">Predict Sentiment</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Stock Sentiment. All Rights Reserved.</p>
    <p>
      <a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a>
    </p>
  </footer>

</body>
</html>
