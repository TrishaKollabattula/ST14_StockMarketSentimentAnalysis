<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
        }

        header {
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.2);
            animation: fadeIn 2s ease-in-out;
        }

        .info {
            margin: 20px;
            font-size: 1.3em;
            max-width: 80%;
            line-height: 1.6;
            animation: slideIn 2s ease-in-out;
        }

        .animated-bg {
            position: relative;
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: url('stock-market-bg.jpg') no-repeat center center/cover;
            animation: backgroundAnimation 5s infinite alternate ease-in-out;
        }

        @keyframes backgroundAnimation {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        #predict-btn {
            font-size: 1.5em;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #28a745;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 5px 15px rgba(40, 167, 69, 0.5);
            transition: transform 0.3s ease-in-out, background 0.3s;
            position: relative;
            z-index: 10;
        }

        #predict-btn:hover {
            transform: scale(1.1);
            background: #218838;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .graph-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('animated-graph.gif') no-repeat center center/cover;
            opacity: 0.4;
            z-index: -1;
        }

        .money-animation {
            position: absolute;
            width: 50px;
            animation: moveMoney 5s linear infinite;
            opacity: 0.8;
        }

        @keyframes moveMoney {
            from { transform: translateY(100vh) rotate(0deg); opacity: 0.9; }
            to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .money1 { left: 15%; animation-duration: 6s; }
        .money2 { left: 35%; animation-duration: 7s; }
        .money3 { left: 55%; animation-duration: 8s; }
        .money4 { left: 75%; animation-duration: 9s; }
        .money5 { left: 90%; animation-duration: 10s; }
    </style>
</head>
<body>
    <div class="graph-bg"></div>
    <div class="container">
        <header>
            <h1>Stock Market Sentiment Analysis</h1>
            <p>Analyze the sentiment of stock market trends in real time</p>
        </header>
        <section class="info">
            <p>The stock market sentiment analysis uses advanced AI to predict market trends based on news, social media, and historical data.</p>
        </section>
        <div class="animated-bg">
            <button id="predict-btn">Predict Sentiment</button>
        </div>
        <footer>
            <p>&copy; 2025 Stock Insights</p>
        </footer>
    </div>
    <img src="money.png" class="money-animation money1">
    <img src="money.png" class="money-animation money2">
    <img src="money.png" class="money-animation money3">
    <img src="money.png" class="money-animation money4">
    <img src="money.png" class="money-animation money5">
</body>
</html>
